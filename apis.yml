  name: Beyond Bank Australia CDR Transactions API
  tags:
  - CDR
  - Open Banking
  - Transactions
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.beyondbank.com.au/open-banking/
  baseURL: https://public.cdr.api.beyondbank.com.au/cds-au/v1/banking/accounts/{accountId}/transactions
  properties:
  - url: https://www.beyondbank.com.au/open-banking/
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-transactions-for-account
    type: APIReference
  - url: openapi/beyond-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Banking Transactions
    API from the standardized DSB Consumer Data Standards surface. Covers GET
    /banking/accounts/{accountId}/transactions (transactions for an account, with
    date/amount/text filters) and GET
    /banking/accounts/{accountId}/transactions/{transactionId} (transaction detail).
    Not public; requires member consent to an Accredited Data Recipient and is served
    over the CDR mutually authenticated (mTLS) FAPI OAuth2/OIDC channel rather than
    the unauthenticated Product Reference Data host.
