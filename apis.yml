    type: APIReference
  - url: openapi/beyond-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Banking Direct Debits
    and Scheduled Payments API from the standardized DSB Consumer Data Standards
    surface. Covers GET /banking/accounts/{accountId}/direct-debits, POST
    /banking/accounts/direct-debits (bulk), GET
    /banking/accounts/{accountId}/payments/scheduled and POST
    /banking/payments/scheduled (bulk scheduled payments). Not public; requires
    member consent to an Accredited Data Recipient and is served over the CDR
    mutually authenticated (mTLS) FAPI OAuth2/OIDC channel, not the public PRD host.
