name: Beyond Bank Australia
kind: company
description: Beyond Bank Australia Limited (ABN 15 087 651 143, AFSL/Australian Credit
  Licence 237856) is one of the country's largest customer-owned (mutual) banks, owned
  by its members rather than shareholders, and the first bank in Australia to become
  a certified B Corp. It serves roughly 280,000 members from around 56 branches across
  South Australia, Victoria, the ACT, Western Australia, and New South Wales, with
  more than nine billion dollars in funds under management, offering everyday accounts,
  savings, term deposits, loans, insurance, and financial planning. As an Authorised
  Deposit-taking Institution (ADI) it participates in Australia's Consumer Data Right
  (CDR / Open Banking), exposing a public, unauthenticated Product Reference Data (PRD)
  API built to the Data Standards Body (DSB) Consumer Data Standards; consumer data
  sharing beyond product reference data requires accredited data recipient status and
  the CDR OAuth2/OIDC FAPI authorization model.
