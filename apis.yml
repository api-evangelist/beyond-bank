apis:
- aid: beyond-bank:beyond-bank-cdr-product-reference-data-api
  name: Beyond Bank Australia CDR Product Reference Data API
  tags:
  - CDR
  - Open Banking
  - Product Reference Data
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.beyondbank.com.au/open-banking/beyond-bank-product-apis/
  baseURL: https://public.cdr.api.beyondbank.com.au/cds-au/v1/banking/products
  properties:
  - url: https://www.beyondbank.com.au/open-banking/beyond-bank-product-apis/
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-products
    type: APIReference
  - url: openapi/beyond-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Public, unauthenticated Consumer Data Right (CDR) Product Reference
    Data API exposing Beyond Bank's banking product catalogue. GET /banking/products
    returns a paginated list of products and GET /banking/products/{productId} returns
    full product detail (rates, fees, features, eligibility, constraints). Confirmed
    live returning HTTP 200 with a data.products array and an x-v response header of
    5 at time of review. Built to the DSB Consumer Data Standards; no API key or
    authorization is required for product reference data.
- aid: beyond-bank:beyond-bank-cdr-accounts-balances-api
  name: Beyond Bank Australia CDR Accounts & Balances API
  tags:
  - CDR
  - Open Banking
  - Accounts
  - Balances
  - Banking
  - Australia
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.beyondbank.com.au/open-banking/
  baseURL: https://public.cdr.api.beyondbank.com.au/cds-au/v1/banking/accounts
  properties:
  - url: https://www.beyondbank.com.au/open-banking/
    type: Documentation
  - url: https://consumerdatastandardsaustralia.github.io/standards/#get-accounts
    type: APIReference
  - url: openapi/beyond-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Banking Accounts and
    Balances API, part of the standardized DSB Consumer Data Standards surface every
    Australian ADI implements. Covers GET /banking/accounts (list accounts), GET
    /banking/accounts/balances (bulk balances), GET /banking/accounts/{accountId}/balance
    (single account balance) and GET /banking/accounts/{accountId} (account detail).
    These endpoints are NOT public; a member must authorize an Accredited Data Recipient
    via the CDR consent flow, and calls are made over the mutually authenticated
    (mTLS) FAPI OAuth2/OIDC channel, not the public PRD host.
