  - url: openapi/beyond-bank-cds-banking-products-openapi.yml
    type: OpenAPI
  description: Consumer-authorized Consumer Data Right (CDR) Banking Payees API from
    the standardized DSB Consumer Data Standards surface. Covers GET /banking/payees
    (list a member's saved payees) and GET /banking/payees/{payeeId} (payee detail,
    including domestic, international, and BPAY payee types). Not public; requires
    member consent to an Accredited Data Recipient and is served over the CDR mutually
    authenticated (mTLS) FAPI OAuth2/OIDC channel rather than the unauthenticated
    Product Reference Data host.
