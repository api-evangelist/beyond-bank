  docs: https://consumerdatastandardsaustralia.github.io/standards/#pagination
idempotency:
  supported: false
  note: >-
    The public PRD surface is read-only (safe, idempotent GET operations by HTTP
    semantics). The CDS defines an x-idempotency-key contract only for consumer-data
    write operations (e.g. payment initiation), which are not part of Beyond Bank's
    public surface — so no Idempotency pointer is asserted for this provider.
request_tracing:
  headers:
